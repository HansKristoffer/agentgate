# The hosted relay: `bun run --filter @agentgate/relay deploy`. Self-hosters can deploy the same Worker.
name = "agentgate-relay"
main = "src/index.ts"
compatibility_date = "2026-08-15"

[[durable_objects.bindings]]
name = "GROUPS"
class_name = "RelayGroup"

[[durable_objects.bindings]]
name = "ADMISSION"
class_name = "RelayAdmission"

[[durable_objects.bindings]]
name = "ENDPOINTS"
class_name = "RemoteEndpoint"

[[durable_objects.bindings]]
name = "CHANNELS"
class_name = "RelayChannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayGroup", "RelayAdmission"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RemoteEndpoint"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RelayChannel"]

# Aggregate per-address throttle (requests per 60 s). Remove to disable.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "7801"
simple = { limit = 1200, period = 60 }

[vars]
RELAY_MAX_GROUPS = "1000"
RELAY_GROUP_MAX_BYTES = "52428800"
RELAY_RETENTION_DAYS = "180"
RELAY_GROUPS_PER_IP_PER_DAY = "5"
RELAY_GROUP_REQUESTS_PER_MINUTE = "600"
RELAY_FAILED_AUTH_PER_MINUTE = "20"
# Remote MCP endpoints (virtual projects): live endpoints, new ones per address per day, public requests per endpoint per minute.
RELAY_MAX_ENDPOINTS = "5000"
RELAY_ENDPOINTS_PER_IP_PER_DAY = "20"
RELAY_ENDPOINT_REQUESTS_PER_MINUTE = "600"
# Node channel (thread handoff between group members): calls and MiB forwarded per group per minute.
RELAY_CHANNEL_REQUESTS_PER_MINUTE = "1200"
RELAY_CHANNEL_MIB_PER_MINUTE = "256"
# Operator switch: "1" stops new groups; existing groups keep working.
RELAY_DISABLE_NEW_GROUPS = "0"
# Self-hosting: `wrangler secret put RELAY_KEY` to require x-relay-key on every request.
