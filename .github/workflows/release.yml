name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # npm provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun scripts/smoke.ts dist/agentgate-linux-x64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm first: the script skips versions already published, so a failed run can be rerun.
      - run: bun scripts/npm.ts "$GITHUB_REF_NAME" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" dist/agentgate-* dist/SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
