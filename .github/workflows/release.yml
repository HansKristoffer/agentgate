name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover (for example v0.5.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Keeps a release PR open with the next version and changelog; merging it tags and creates the release.
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
  publish:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    # macOS, to sign the macOS binaries with codesign. CI covers the Linux binaries.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # npm provenance
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - name: Validate the existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
      - uses: actions/checkout@v5
      - name: Keep package recovery tools
        run: cp scripts/npm.ts "$RUNNER_TEMP/agentgate-npm.ts"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: node -e 'if (require("./package.json").version !== process.env.TAG.slice(1)) process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Into a temporary keychain that scripts/build.ts signs from. Fail rather than publish unsigned binaries.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] || { echo "::error::Missing Apple signing secrets"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - run: bun run build
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - run: codesign --verify --strict dist/agentgate-darwin-arm64 dist/agentgate-darwin-x64
      - run: bun scripts/smoke.ts dist/agentgate-darwin-arm64
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # The script skips versions already on npm, so a failed run can be rerun.
      - run: bun "$RUNNER_TEMP/agentgate-npm.ts" "$TAG" --publish
      - run: gh release upload "$TAG" dist/agentgate-* dist/SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  desktop:
    permissions:
      contents: write
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/build-macos.yml
    with:
      tag_name: ${{ inputs.tag || needs.release-please.outputs.tag }}
    secrets: inherit
