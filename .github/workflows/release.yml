name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover (for example v0.5.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Keeps a release PR open with the next version and changelog; merging it tags and creates the release.
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
  publish:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # npm provenance
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - name: Validate the existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
      - uses: actions/checkout@v5
      - name: Keep package recovery tools
        run: cp scripts/npm.ts "$RUNNER_TEMP/agentgate-npm.ts"
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: node -e 'if (require("./package.json").version !== process.env.TAG.slice(1)) process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun scripts/smoke.ts dist/agentgate-linux-x64
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # The script skips versions already on npm, so a failed run can be rerun.
      - run: bun "$RUNNER_TEMP/agentgate-npm.ts" "$TAG" --publish
      - run: gh release upload "$TAG" dist/agentgate-* dist/SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  desktop:
    permissions:
      contents: write
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/build-macos.yml
    with:
      tag_name: ${{ inputs.tag || needs.release-please.outputs.tag }}
    secrets: inherit
