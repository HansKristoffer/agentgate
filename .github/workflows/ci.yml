name: check
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (!/^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([^\r\n]+\))?!?: \S[^\r\n]*$/.test(title)) {
              core.setFailed('Use a conventional PR title, for example fix: handle startup failures or feat!: change the public API.');
              return;
            }
            // The squash commit takes the PR title, and release-please writes the changelog
            // and picks the version from it alone, so the title must cover the commits' types.
            const rank = (subject) => {
              const m = /^(\w+)(\([^)]*\))?(!)?:/.exec(subject);
              if (!m) return 0;
              return m[3] ? 3 : m[1] === 'feat' ? 2 : ['fix', 'perf'].includes(m[1]) ? 1 : 0;
            };
            const commits = await github.paginate(github.rest.pulls.listCommits, { ...context.repo, pull_number: context.payload.pull_request.number });
            const top = commits.map((c) => c.commit.message.split('\n')[0]).sort((x, y) => rank(y) - rank(x))[0];
            if (top && rank(top) > rank(title)) {
              core.setFailed(`The PR title hides "${top}" from the changelog. Squashing keeps only the title, so give it that commit's type (${['', 'fix or perf', 'feat', 'a breaking !'][rank(top)]}).`);
            }

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun fmt --no-script --check .
      - run: bun run typecheck
      - run: bun test
      - run: bun run --filter @agentgate/relay test:workers
      - run: bun run build:frontend
      - run: bun build apps/agentgate/src/cli.ts --compile --minify --outfile dist/agentgate
      - run: bun scripts/smoke.ts dist/agentgate
  desktop:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: bun scripts/desktop-prepare.ts
      - run: bun run build:frontend
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: bun run check:native
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: bun run --filter @agentgate/desktop tauri build --debug --bundles app
